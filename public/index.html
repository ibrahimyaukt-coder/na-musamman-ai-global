<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NA MUSAMMAN AI GLOBAL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #ffffff;
      --sidebar: #f7f7f8;
      --text: #171717;
      --muted: #6b7280;
      --border: #e5e7eb;
      --input: #f7f7f8;
      --user: #eaf3ff;
      --assistant: #ffffff;
      --accent: #2563eb;
    }

    body.dark {
      --bg: #171717;
      --sidebar: #202020;
      --text: #f5f5f5;
      --muted: #a1a1aa;
      --border: #333333;
      --input: #242424;
      --user: #12335c;
      --assistant: #171717;
      --accent: #60a5fa;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
    }

    /* SIDEBAR */

    .sidebar {
      width: 270px;
      height: 100vh;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 14px;
      flex-shrink: 0;
    }

    .brand {
      font-size: 17px;
      font-weight: 700;
      padding: 12px 8px 16px;
      line-height: 1.25;
    }

    .brand span {
      color: var(--accent);
    }

    .new-chat {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 10px;
      padding: 11px 13px;
      text-align: left;
      margin-bottom: 18px;
    }

    .new-chat:hover {
      background: var(--input);
    }

    .history-title {
      color: var(--muted);
      font-size: 12px;
      margin: 4px 8px 8px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
    }

    .history-item {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 4px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover {
      background: var(--input);
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .side-button {
      width: 100%;
      padding: 10px;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      border-radius: 8px;
    }

    .side-button:hover {
      background: var(--input);
    }

    /* MAIN */

    .main {
      flex: 1;
      min-width: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .topbar {
      height: 58px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 12px;
      flex-shrink: 0;
    }

    .mobile-menu {
      display: none;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 22px;
    }

    .top-title {
      font-weight: 700;
      flex: 1;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px 150px;
    }

    .welcome {
      max-width: 760px;
      margin: 80px auto 0;
      text-align: center;
    }

    .welcome-logo {
      width: 64px;
      height: 64px;
      margin: auto;
      border-radius: 18px;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      margin-bottom: 18px;
    }

    .welcome h1 {
      font-size: 28px;
      margin: 0 0 10px;
    }

    .welcome p {
      color: var(--muted);
      margin: 0;
    }

    /* MESSAGES */

    .message-row {
      width: 100%;
      display: flex;
      margin: 14px 0;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message {
      max-width: min(78%, 850px);
      border-radius: 16px;
      padding: 12px 15px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user {
      background: var(--user);
      border-bottom-right-radius: 5px;
    }

    .message.assistant {
      background: var(--assistant);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }

    .message-images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .message-images img {
      width: 180px;
      max-width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    /* COMPOSER */

    .composer-area {
      position: fixed;
      left: 270px;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        transparent,
        var(--bg) 30%
      );
      padding: 24px 18px 14px;
    }

    .composer {
      max-width: 900px;
      margin: auto;
    }

    .preview {
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .preview-item {
      position: relative;
      width: 72px;
      height: 72px;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .remove-image {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 50%;
      background: #111;
      color: white;
      font-size: 12px;
      line-height: 22px;
      padding: 0;
    }

    .input-box {
      border: 1px solid var(--border);
      background: var(--input);
      border-radius: 16px;
      display: flex;
      align-items: flex-end;
      gap: 7px;
      padding: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    .tool-button {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      border-radius: 10px;
      font-size: 20px;
    }

    .tool-button:hover {
      background: var(--border);
    }

    textarea {
      flex: 1;
      min-height: 40px;
      max-height: 160px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 10px 4px;
      line-height: 1.4;
    }

    .send-button {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 18px;
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .composer-note {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
    }

    #file {
      display: none;
    }

    /* LOADING */

    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: blink 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes blink {
      0%, 80%, 100% {
        opacity: .3;
      }

      40% {
        opacity: 1;
      }
    }

    /* MOBILE */

    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        z-index: 50;
        transition: left .2s ease;
      }

      .sidebar.open {
        left: 0;
      }

      .mobile-menu {
        display: block;
      }

      .composer-area {
        left: 0;
        padding-left: 10px;
        padding-right: 10px;
      }

      .message {
        max-width: 88%;
      }

      .welcome {
        margin-top: 50px;
      }

      .welcome h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <span>NA MUSAMMAN</span><br>
      AI GLOBAL
    </div>

    <button class="new-chat" id="newChat">
      ＋ New chat
    </button>

    <div class="history-title">
      Chat History
    </div>

    <div class="history" id="history"></div>

    <div class="sidebar-bottom">
      <button class="side-button" id="darkMode">
        🌙 Dark mode
      </button>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">

      <button
        class="mobile-menu"
        id="mobileMenu"
      >
        ☰
      </button>

      <div class="top-title">
        NA MUSAMMAN AI GLOBAL
      </div>

      <div
        class="status"
        id="status"
      >
        AI Assistant
      </div>

    </header>

    <section
      class="chat"
      id="chat"
    >

      <div
        class="welcome"
        id="welcome"
      >

        <div class="welcome-logo">
          NM
        </div>

        <h1>
          How can I help you?
        </h1>

        <p>
          Ask questions, write content, study, translate,
          or upload images for analysis.
        </p>

      </div>

    </section>

    <div class="composer-area">

      <div class="composer">

        <div
          class="preview"
          id="preview"
        ></div>

        <div class="input-box">

          <button
            class="tool-button"
            id="uploadButton"
            title="Upload images"
          >
            ＋
          </button>

          <input
            id="file"
            type="file"
            accept="image/*"
            multiple
          >

          <textarea
            id="message"
            placeholder="Message NA MUSAMMAN AI GLOBAL..."
            rows="1"
          ></textarea>

          <button
            class="tool-button"
            id="voiceButton"
            title="Voice input"
          >
            🎤
          </button>

          <button
            class="send-button"
            id="sendButton"
            title="Send"
          >
            ➤
          </button>

        </div>

        <div class="composer-note">
          NA MUSAMMAN AI GLOBAL can make mistakes. Check important information.
        </div>

      </div>

    </div>

  </main>

</div>

<script>
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");

  const messageInput =
    document.getElementById("message");

  const sendButton =
    document.getElementById("sendButton");

  const uploadButton =
    document.getElementById("uploadButton");

  const fileInput =
    document.getElementById("file");

  const preview =
    document.getElementById("preview");

  const historyBox =
    document.getElementById("history");

  const newChatButton =
    document.getElementById("newChat");

  const darkModeButton =
    document.getElementById("darkMode");

  const voiceButton =
    document.getElementById("voiceButton");

  const statusBox =
    document.getElementById("status");

  const sidebar =
    document.getElementById("sidebar");

  const mobileMenu =
    document.getElementById("mobileMenu");

  let imageData = [];

  let conversation = [];

  let savedChats = [];

  let isSending = false;

  /* STORAGE */

  function loadStorage() {
    try {
      const saved =
        localStorage.getItem(
          "na_musamman_chats"
        );

      if (saved) {
        savedChats = JSON.parse(saved);
      }

      const theme =
        localStorage.getItem(
          "na_musamman_theme"
        );

      if (theme === "dark") {
        document.body.classList.add("dark");
      }
    } catch (error) {
      console.log(error);
    }

    renderHistory();
  }

  function saveStorage() {
    try {
      localStorage.setItem(
        "na_musamman_chats",
        JSON.stringify(savedChats)
      );
    } catch (error) {
      console.log(error);
    }
  }

  /* HISTORY */

  function renderHistory() {
    historyBox.innerHTML = "";

    savedChats.forEach(function (item, index) {

      const div =
        document.createElement("div");

      div.className = "history-item";

      div.textContent =
        item.title || "New chat";

      div.onclick = function () {
        openSavedChat(index);
      };

      historyBox.appendChild(div);
    });
  }

  function saveCurrentChat() {

    if (!conversation.length) {
      return;
    }

    const firstUser =
      conversation.find(
        function (item) {
          return item.role === "user";
        }
      );

    const title =
      firstUser &&
      firstUser.content
        ? firstUser.content.substring(0, 45)
        : "New chat";

    savedChats.unshift({
      title: title,
      messages: conversation
    });

    if (savedChats.length > 30) {
      savedChats =
        savedChats.slice(0, 30);
    }

    saveStorage();
    renderHistory();
  }

  function openSavedChat(index) {

    const saved =
      savedChats[index];

    if (!saved) {
      return;
    }

    conversation =
      Array.isArray(saved.messages)
        ? saved.messages
        : [];

    chat.innerHTML = "";

    conversation.forEach(function (item) {
      addMessageToScreen(
        item.role,
        item.content || "",
        item.images || []
      );
    });

    sidebar.classList.remove("open");

    scrollToBottom();
  }

  /* NEW CHAT */

  function startNewChat() {

    if (conversation.length) {
      saveCurrentChat();
    }

    conversation = [];
    imageData = [];

    chat.innerHTML = "";

    chat.appendChild(
      createWelcome()
    );

    renderPreview();

    messageInput.value = "";

    autoResize();

    sidebar.classList.remove("open");
  }

  function createWelcome() {

    const div =
      document.createElement("div");

    div.className = "welcome";

    div.id = "welcome";

    div.innerHTML = `
      <div class="welcome-logo">NM</div>
      <h1>How can I help you?</h1>
      <p>
        Ask questions, write content, study, translate,
        or upload images for analysis.
      </p>
    `;

    return div;
  }

  /* SCREEN MESSAGES */

  function addMessageToScreen(
    role,
    text,
    images
  ) {

    if (welcome &&
        welcome.parentNode) {
      welcome.remove();
    }

    const row =
      document.createElement("div");

    row.className =
      "message-row " +
      (role === "user"
        ? "user"
        : "assistant");

    const bubble =
      document.createElement("div");

    bubble.className =
      "message " +
      (role === "user"
        ? "user"
        : "assistant");

    if (
      Array.isArray(images) &&
      images.length
    ) {

      const imageContainer =
        document.createElement("div");

      imageContainer.className =
        "message-images";

      images.forEach(function (src) {

        const img =
          document.createElement("img");

        img.src = src;

        img.alt = "Uploaded image";

        imageContainer.appendChild(img);
      });

      bubble.appendChild(
        imageContainer
      );
    }

    if (text) {

      const textDiv =
        document.createElement("div");

      textDiv.textContent = text;

      bubble.appendChild(
        textDiv
      );
    }

    row.appendChild(bubble);

    chat.appendChild(row);

    scrollToBottom();
  }

  function addTypingMessage() {

    const row =
      document.createElement("div");

    row.className =
      "message-row assistant";

    row.id = "typingMessage";

    const bubble =
      document.createElement("div");

    bubble.className =
      "message assistant";

    bubble.innerHTML = `
      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>
    `;

    row.appendChild(bubble);

    chat.appendChild(row);

    scrollToBottom();
  }

  function removeTypingMessage() {

    const item =
      document.getElementById(
        "typingMessage"
      );

    if (item) {
      item.remove();
    }
  }

  function scrollToBottom() {
    setTimeout(function () {
      chat.scrollTop =
        chat.scrollHeight;
    }, 30);
  }

  /* IMAGE */

  uploadButton.onclick =
    function () {
      fileInput.click();
    };

  fileInput.onchange =
    async function (event) {

      const files =
        Array.from(
          event.target.files || []
        );

      for (const file of files) {

        if (!file.type.startsWith("image/")) {
          continue;
        }

        try {

          const resized =
            await resizeImage(file);

          imageData.push(resized);

        } catch (error) {

          console.error(
            "Image error:",
            error
          );
        }
      }

      renderPreview();

      fileInput.value = "";
    };

  function resizeImage(file) {

    return new Promise(
      function (resolve, reject) {

        const reader =
          new FileReader();

        reader.onload =
          function () {

            const img =
              new Image();

            img.onload =
              function () {

                const maxSize =
                  1400;

                let width =
                  img.width;

                let height =
                  img.height;

                if (
                  width > maxSize ||
                  height > maxSize
                ) {

                  const scale =
                    Math.min(
                      maxSize / width,
                      maxSize / height
                    );

                  width =
                    Math.round(
                      width * scale
                    );

                  height =
                    Math.round(
                      height * scale
                    );
                }

                const canvas =
                  document.createElement(
                    "canvas"
                  );

                canvas.width =
                  width;

                canvas.height =
                  height;

                const ctx =
                  canvas.getContext(
                    "2d"
                  );

                ctx.drawImage(
                  img,
                  0,
                  0,
                  width,
                  height
                );

                resolve(
                  canvas.toDataURL(
                    "image/jpeg",
                    0.82
                  )
                );
              };

            img.onerror =
              reject;

            img.src =
              reader.result;
          };

        reader.onerror =
          reject;

        reader.readAsDataURL(file);
      }
    );
  }

  function renderPreview() {

    preview.innerHTML = "";

    if (!imageData.length) {
      preview.style.display = "none";
      return;
    }

    preview.style.display = "flex";

    imageData.forEach(
      function (src, index) {

        const item =
          document.createElement("div");

        item.className =
          "preview-item";

        const img =
          document.createElement("img");

        img.src = src;

        const remove =
          document.createElement("button");

        remove.className =
          "remove-image";

        remove.textContent =
          "×";

        remove.onclick =
          function () {

            imageData.splice(
              index,
              1
            );

            renderPreview();
          };

        item.appendChild(img);
        item.appendChild(remove);

        preview.appendChild(item);
      }
    );
  }

  /* SEND */

  sendButton.onclick =
    sendMessage;

  messageInput.addEventListener(
    "keydown",
    function (event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();
      }
    }
  );

  async function sendMessage() {

    if (isSending) {
      return;
    }

    const text =
      messageInput.value.trim();

    if (
      !text &&
      imageData.length === 0
    ) {
      return;
    }

    isSending = true;

    sendButton.disabled = true;

    const sentText = text;

    const sentImages =
      [...imageData];

    messageInput.value = "";

    imageData = [];

    renderPreview();

    autoResize();

    addMessageToScreen(
      "user",
      sentText,
      sentImages
    );

    conversation.push({
      role: "user",
      content: sentText,
      images: sentImages
    });

    addTypingMessage();

    statusBox.textContent =
      "Thinking...";

    try {

      const response =
        await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              message: sentText,
              images: sentImages,
              image:
                sentImages.length
                  ? sentImages[0]
                  : null,
              history:
                conversation.slice(
                  0,
                  -1
                )
            })
          }
        );

      const data =
        await response.json();

      removeTypingMessage();

      if (!response.ok) {

        throw new Error(
          data.error ||
          "Failed to send message."
        );
      }

      const answer =
        data.answer ||
        "I could not generate a response.";

      addMessageToScreen(
        "assistant",
        answer,
        []
      );

      conversation.push({
        role: "assistant",
        content: answer,
        images: []
      });

      statusBox.textContent =
        "AI Assistant";

    } catch (error) {

      removeTypingMessage();

      const errorMessage =
        "An error occurred: " +
        (
          error &&
          error.message
            ? error.message
            : "Unable to connect to AI."
        );

      addMessageToScreen(
        "assistant",
        errorMessage,
        []
      );

      conversation.push({
        role: "assistant",
        content: errorMessage,
        images: []
      });

      statusBox.textContent =
        "Connection error";

      console.error(
        "Send error:",
        error
      );

    } finally {

      isSending = false;

      sendButton.disabled = false;

      messageInput.focus();

      scrollToBottom();
    }
  }

  /* TEXTAREA */

  messageInput.addEventListener(
    "input",
    autoResize
  );

  function autoResize() {

    messageInput.style.height =
      "auto";

    messageInput.style.height =
      Math.min(
        messageInput.scrollHeight,
        160
      ) + "px";
  }

  /* DARK MODE */

  darkModeButton.onclick =
    function () {

      document.body.classList.toggle(
        "dark"
      );

      const isDark =
        document.body.classList.contains(
          "dark"
        );

      localStorage.setItem(
        "na_musamman_theme",
        isDark
          ? "dark"
          : "light"
      );
    };

  /* NEW CHAT */

  newChatButton.onclick =
    startNewChat;

  /* MOBILE MENU */

  mobileMenu.onclick =
    function () {

      sidebar.classList.toggle(
        "open"
      );
    };

  /* VOICE */

  let recognition = null;

  if (
    "SpeechRecognition" in window ||
    "webkitSpeechRecognition" in window
  ) {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    recognition =
      new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.lang = "en-US";

    recognition.onstart =
      function () {
        voiceButton.textContent =
          "🔴";
      };

    recognition.onend =
      function () {
        voiceButton.textContent =
          "🎤";
      };

    recognition.onresult =
      function (event) {

        const result =
          event.results[0][0].transcript;

        messageInput.value =
          (
            messageInput.value
              ? messageInput.value + " "
              : ""
          ) + result;

        autoResize();

        messageInput.focus();
      };

    recognition.onerror =
      function () {
        voiceButton.textContent =
          "🎤";
      };
  }

  voiceButton.onclick =
    function () {

      if (!recognition) {

        alert(
          "Voice input is not supported by this browser."
        );

        return;
      }

      try {
        recognition.start();
      } catch (error) {
        console.log(error);
      }
    };

  /* START */

  loadStorage();

  autoResize();

  messageInput.focus();
</script>

</body>
</html>
