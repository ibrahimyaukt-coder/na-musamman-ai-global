<script>

  /* =========================
     STATE
  ========================= */

  let imageData = [];

  let messages = [];

  let chats = JSON.parse(
    localStorage.getItem("naMusammanChats") || "[]"
  );


  /* =========================
     ELEMENTS
  ========================= */

  const chat =
    document.getElementById("chat");

  const welcome =
    document.getElementById("welcome");

  const messageInput =
    document.getElementById("message");

  const sendBtn =
    document.getElementById("sendBtn");

  const uploadBtn =
    document.getElementById("uploadBtn");

  const fileInput =
    document.getElementById("file");

  const preview =
    document.getElementById("preview");

  const historyBox =
    document.getElementById("history");

  const newChat =
    document.getElementById("newChat");

  const micBtn =
    document.getElementById("micBtn");

  const settingsBtn =
    document.getElementById("settingsBtn");

  const settingsPanel =
    document.getElementById("settingsPanel");

  const darkMode =
    document.getElementById("darkMode");

  const clearHistory =
    document.getElementById("clearHistory");


  /* =========================
     DARK MODE
  ========================= */

  const savedDark =
    localStorage.getItem("naMusammanDark");

  if (savedDark === "true") {
    document.body.classList.add("dark");
    darkMode.checked = true;
  }

  darkMode.addEventListener("change", () => {

    document.body.classList.toggle(
      "dark",
      darkMode.checked
    );

    localStorage.setItem(
      "naMusammanDark",
      darkMode.checked
    );

  });


  /* =========================
     SETTINGS
  ========================= */

  settingsBtn.addEventListener("click", () => {

    settingsPanel.classList.toggle("hidden");

  });


  clearHistory.addEventListener("click", () => {

    localStorage.removeItem("naMusammanChats");

    chats = [];

    renderHistory();

    startNewChat();

  });


  /* =========================
     NEW CHAT
  ========================= */

  newChat.addEventListener(
    "click",
    startNewChat
  );


  function startNewChat() {

    messages = [];

    imageData = [];

    chat.innerHTML = "";

    chat.appendChild(
      createWelcome()
    );

    clearPreview();

  }


  function createWelcome() {

    const div =
      document.createElement("div");

    div.className = "welcome";

    div.innerHTML = `
      <div class="welcome-logo">✦</div>

      <h1>NA MUSAMMAN AI GLOBAL</h1>

      <p>
        AI Assistant for questions, education,
        writing, translation, reports and image understanding.
      </p>
    `;

    return div;

  }


  /* =========================
     IMAGE UPLOAD
  ========================= */

  uploadBtn.addEventListener(
    "click",
    () => fileInput.click()
  );


  fileInput.addEventListener(
    "change",
    async () => {

      const files =
        Array.from(fileInput.files || []);

      if (!files.length) return;

      imageData = [];

      clearPreview();

      for (const file of files) {

        if (!file.type.startsWith("image/")) {
          continue;
        }

        const data =
          await resizeImage(file);

        imageData.push(data);

      }

      renderPreview();

      fileInput.value = "";

    }
  );


  /* =========================
     RESIZE IMAGE
  ========================= */

  function resizeImage(file) {

    return new Promise((resolve) => {

      const reader =
        new FileReader();

      reader.onload = () => {

        const img =
          new Image();

        img.onload = () => {

          const maxSize = 1400;

          let width =
            img.width;

          let height =
            img.height;

          if (width > maxSize) {

            height =
              Math.round(
                height *
                maxSize /
                width
              );

            width = maxSize;

          }

          if (height > maxSize) {

            width =
              Math.round(
                width *
                maxSize /
                height
              );

            height = maxSize;

          }

          const canvas =
            document.createElement("canvas");

          canvas.width = width;
          canvas.height = height;

          const ctx =
            canvas.getContext("2d");

          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );

          resolve(
            canvas.toDataURL(
              "image/jpeg",
              0.82
            )
          );

        };

        img.src =
          reader.result;

      };

      reader.readAsDataURL(file);

    });

  }


  /* =========================
     IMAGE PREVIEW
  ========================= */

  function renderPreview() {

    preview.innerHTML = "";

    if (!imageData.length) {

      preview.classList.add(
        "hidden"
      );

      return;

    }

    preview.classList.remove(
      "hidden"
    );

    imageData.forEach(
      (src, index) => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "preview-item";

        item.innerHTML = `
          <img src="${src}">
          <button
            class="remove-image"
            data-index="${index}">
            ×
          </button>
        `;

        preview.appendChild(item);

      }
    );

    document
      .querySelectorAll(".remove-image")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const index =
              Number(
                button.dataset.index
              );

            imageData.splice(
              index,
              1
            );

            renderPreview();

          }
        );

      });

  }


  function clearPreview() {

    imageData = [];

    preview.innerHTML = "";

    preview.classList.add(
      "hidden"
    );

  }


  /* =========================
     SEND MESSAGE
  ========================= */

  sendBtn.addEventListener(
    "click",
    sendMessage
  );


  messageInput.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  async function sendMessage() {

    const text =
      messageInput.value.trim();

    if (
      !text &&
      imageData.length === 0
    ) {
      return;
    }


    if (welcome) {
      welcome.remove();
    }


    const userText =
      text ||
      "Please analyze these images.";


    const currentImages =
      [...imageData];


    addMessage(
      "user",
      userText,
      currentImages
    );


    messages.push({

      role: "user",

      content: userText,

      images: currentImages

    });


    messageInput.value = "";

    clearPreview();


    const loading =
      addMessage(
        "assistant",
        "Thinking..."
      );


    try {

      const history =
        messages
          .slice(-12)
          .map(item => ({

            role:
              item.role,

            content:
              item.content,

            image:
              item.images?.[0] || null

          }));


      const response =
        await fetch(
          "/api/chat",
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              message:
                userText,

              images:
                currentImages,

              image:
                currentImages[0] ||
                null,

              history

            })

          }
        );


      const data =
        await response.json();


      loading.remove();


      if (!response.ok) {

        throw new Error(
          data?.error ||
          "Request failed."
        );

      }


      const answer =
        data?.answer ||
        "I could not generate a response.";


      addMessage(
        "assistant",
        answer
      );


      messages.push({

        role: "assistant",

        content: answer,

        images: []

      });


      saveChat();

    } catch (error) {

      loading.remove();

      addMessage(
        "assistant",
        "❌ Error: " +
        error.message
      );

    }

  }


  /* =========================
     ADD MESSAGE
  ========================= */

  function addMessage(
    role,
    text,
    images = []
  ) {

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "message-row " +
      role;


    const bubble =
      document.createElement(
        "div"
      );

    bubble.className =
      "message";


    if (
      images &&
      images.length
    ) {

      const imagesBox =
        document.createElement(
          "div"
        );

      imagesBox.className =
        "message-images";


      images.forEach(
        src => {

          const img =
            document.createElement(
              "img"
            );

          img.src = src;

          imagesBox.appendChild(
            img
          );

        }
      );


      bubble.appendChild(
        imagesBox
      );

    }


    const textDiv =
      document.createElement(
        "div"
      );

    textDiv.textContent =
      text;


    bubble.appendChild(
      textDiv
    );


    row.appendChild(
      bubble
    );


    chat.appendChild(
      row
    );


    chat.scrollTop =
      chat.scrollHeight;


    return row;

  }


  /* =========================
     SAVE CHAT
  ========================= */

  function saveChat() {

    if (!messages.length) {
      return;
    }


    const firstUser =
      messages.find(
        item =>
          item.role === "user"
      );


    const title =
      firstUser?.content ||
      "New chat";


    const chatData = {

      id:
        Date.now(),

      title:
        title.substring(
          0,
          60
        ),

      messages:
        messages

    };


    chats.unshift(
      chatData
    );


    chats =
      chats.slice(
        0,
        30
      );


    localStorage.setItem(
      "naMusammanChats",
      JSON.stringify(chats)
    );


    renderHistory();

  }


  /* =========================
     HISTORY
  ========================= */

  function renderHistory() {

    historyBox.innerHTML = "";


    chats.forEach(
      item => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "history-item";

        div.textContent =
          item.title;


        div.addEventListener(
          "click",
          () => loadChat(item)
        );


        historyBox.appendChild(
          div
        );

      }
    );

  }


  function loadChat(savedChat) {

    messages =
      savedChat.messages || [];


    chat.innerHTML = "";


    messages.forEach(
      item => {

        addMessage(

          item.role,

          item.content,

          item.images || []

        );

      }
    );

  }


  renderHistory();


  /* =========================
     VOICE INPUT
  ========================= */

  let recognition = null;


  if (
    "webkitSpeechRecognition"
    in window
  ) {

    recognition =
      new webkitSpeechRecognition();

    recognition.continuous =
      false;

    recognition.interimResults =
      false;

    recognition.lang =
      "ha-NG";


    recognition.onresult =
      (event) => {

        const transcript =
          event
            .results[0][0]
            .transcript;

        messageInput.value +=
          transcript;

      };


    recognition.onerror =
      () => {

        console.log(
          "Voice recognition error"
        );

      };

  }


  micBtn.addEve
